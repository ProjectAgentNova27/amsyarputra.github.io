<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amsyar Putra | Personal Tech Portal</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        :root {
            --text-color: white;
            --card-bg: rgba(0, 0, 0, 0.6);
            --card-border: rgba(255, 255, 255, 0.15);
            --hover-bg: rgba(255, 255, 255, 0.15);
            --accent-color: #38bdf8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: url('style/32993418_771486081870.jpg') no-repeat center center/cover;
            color: var(--text-color);
            text-align: center;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: -1;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 30px 15px;
        }

        h1 {
            margin-bottom: 5px;
            font-size: clamp(2.2rem, 6vw, 4rem);
        }

        .tagline {
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: 4px;
            color: var(--accent-color);
            font-weight: bold;
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            width: min(720px, 100%);
            margin-bottom: 20px;
        }

        .section-title {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: var(--accent-color);
            text-transform: uppercase;
        }

        .links {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .link {
            text-decoration: none;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px 10px;
            border-radius: 12px;
            transition: 0.2s ease;
        }

        .link:hover {
            background: var(--hover-bg);
            transform: translateY(-3px);
        }

        .link i {
            font-size: 30px;
            margin-bottom: 8px;
            color: var(--accent-color);
        }

        .warning {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-top: -6px;
            margin-bottom: 18px;
        }

        .socials {
            margin-top: 4px;
        }

        .socials a {
            margin: 0 10px;
            color: var(--text-color);
            font-size: 24px;
            text-decoration: none;
            transition: 0.2s ease;
        }

        .socials a:hover {
            color: var(--accent-color);
        }

        @media (max-width: 700px) {
            .links {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 420px) {
            .links {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- MAIN PUBLIC LINKS -->
        <div class="card">

                    <i class="fab fa-discord"></i>
                    Discord

                    <i class="fas fa-desktop"></i>

                </a>

                <a href="https://open.spotify.com" class="link" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-spotify"></i>
                    Spotify
                </a>

                <a href="https://chatgpt.com" class="link" target="_blank" rel="noopener noreferrer">
                    <i class="fas fa-robot"></i>
                    ChatGPT
                </a>

                <a href="https://store.steampowered.com" class="link" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-steam"></i>
                    Steam
                </a>

                <a href="mailto:your-email@amsyarputra.net" class="link">
                    <i class="fas fa-envelope"></i>

                </a>
            </div>
        </div>

        <!-- HOME NETWORK / PRIVATE PORTAL -->
        <div class="card">
            <h2 class="section-title">Home Portal</h2>

            <div class="links">
                <a href="#" class="link" target="_blank" rel="noopener noreferrer">

                </a>

                <a href="#" class="link" target="_blank" rel="noopener noreferrer">
                    <i class="fas fa-wifi"></i>
                    Router
                </a>

                <a href="#" class="link" target="_blank" rel="noopener noreferrer">
                    <i class="fas fa-server"></i>
                    NAS / Files
                </a>

                <a href="#" class="link" target="_blank" rel="noopener noreferrer">
                    <i class="fas fa-shield-halved"></i>
                    VPN
                </a>

                <a href="#" class="link" target="_blank" rel="noopener noreferrer">
                    <i class="fas fa-cloud"></i>
                    Cloudflare
                </a>

                <a href="#" class="link" target="_blank" rel="noopener noreferrer">
                    <i class="fas fa-gamepad"></i>

                </a>
            </div>
        </div>

        <!-- SOCIAL LINKS -->
        <div class="socials">
            <a href="#" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                <i class="fab fa-instagram"></i>
            </a>

            <a href="#" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
                <i class="fab fa-facebook"></i>
            </a>

            <a href="#" target="_blank" rel="noopener noreferrer" aria-label="X">
                <i class="fab fa-x-twitter"></i>
            </a>

            <a href="https://github.com/ProjectAgentNova27" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                <i class="fab fa-github"></i>
            </a>
        </div>
    </div>
</body>
</html>
